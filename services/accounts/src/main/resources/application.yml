server:
  port: 8089
spring:
  application:
    name: "accounts"
  profiles:
    active: "prod"
  #Here we are mentioning where is our message queue
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: "guest"
    password: "guest"
  datasource:
    url: jdbc:mysql://localhost:3306/accountsdb
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
  #this info enabled true is allowing to show info properties on Eureka dashBOARD
  info:
    env:
      enabled: true
#this endpoint at root level is different from management endpoint
endpoints:
  shutdown:
    enabled: true
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
info:
  app:
    name: "accounts"
    description: "Accounts micro service"
    version: "1.0.0"

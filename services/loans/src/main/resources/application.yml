server:
  port: 8090
spring:
  application:
    name: "loans"
  config:
    import: "configserver:http://localhost:8071/"
  #Here we are mentioning where is our message queue
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"
#commenting H2 db conf since we are going to use mysql db
#  datasource:
#    url: jdbc:h2:mem:testdb
#    driverClassName: org.h2.Driver
#    username: sa
#    password: ''
#  h2:
#    console:
#      enabled: true
#  jpa:
#    database-platform: org.hibernate.dialect.H2Dialect
#    hibernate:
#      ddl-auto: update
#    show-sql: true
  datasource:
    url: jdbc:mysql:localhost://3308/loansdb
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
      endpoint:
        shutdown:
          enabled: true
        #this info enabled true is allowing to show info properties on Eureka dashBOARD
        info:
          env:
            enabled: true
      #this endpoint at root level is different from management endpoint
      endpoints:
        shutdown:
          enabled: true
      eureka:
        instance:
          prefer-ip-address: true
        client:
          fetchRegistry: true
          registerWithEureka: true
          serviceUrl:
            defaultZone: http://localhost:8070/eureka/
      #This info is being displayed on Eureka dashboard
      info:
        app:
          name: "loans"
          description: "Loans micro service"
          version: "1.0.0"


spring:
  application:
    name: "configserver"
  profiles:
    #    active: native
    active: git
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/komal-jaiswal/microservices-config.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: false
  rabbitmq:
    password: "guest"
    username: "guest"
    port: 5672
    host: rabbitmq
encrypt:
  key: "Ga+#v/D~fPCv{v=h]O(3K%(uz1AHbz"

server:
  port: 8071
management:
  endpoints:
    web:
      exposure:
        include: "*" #required for invoking actuator/busrefresh
  health: #this is to first make sure config server is live and ready to accept traffic then only start account/loan and card ms
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
